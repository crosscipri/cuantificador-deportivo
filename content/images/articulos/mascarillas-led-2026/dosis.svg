<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" role="img" aria-labelledby="title desc">
<title>Dosis por sesión</title>
<desc>Barras de J por cm2 frente a la zona de 5 a 9.</desc>
<rect width="880" height="460" fill="#ffffff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#161616}</style>
<text x="32" y="32" font-size="18" font-weight="700">Dosis de la sesión publicada</text><text x="32" y="52" font-size="12" fill="#505050">La banda azul es la zona de unos 5–9 J/cm² que usa Fergus. No es una prescripción.</text><rect x="365.6" y="70" width="124.4" height="288" fill="#edf3ff"/><text x="210.0" y="432" font-size="12" fill="#505050" text-anchor="middle">0</text><text x="365.6" y="432" font-size="12" fill="#505050" text-anchor="middle">5</text><text x="490.0" y="432" font-size="12" fill="#505050" text-anchor="middle">9</text><text x="676.7" y="432" font-size="12" fill="#505050" text-anchor="middle">15</text><text x="490" y="452" font-size="12" fill="#505050" text-anchor="middle">J/cm² por sesión</text><text x="198" y="98" font-size="14" text-anchor="end">Nanoleaf</text><rect x="210" y="78" width="202.2" height="28" fill="#0055ff"/><text x="420.2" y="97" font-size="13">6,5</text><text x="198" y="146" font-size="14" text-anchor="end">INIA Glow</text><rect x="210" y="126" width="336.0" height="28" fill="#161616"/><text x="554.0" y="145" font-size="13">10,8</text><text x="198" y="194" font-size="14" text-anchor="end">LumaLux Face Pro</text><rect x="210" y="174" width="118.2" height="28" fill="#161616"/><text x="336.2" y="193" font-size="13">3,8</text><text x="198" y="242" font-size="14" text-anchor="end">CurrentBody Series 2</text><rect x="210" y="222" width="348.4" height="28" fill="#161616"/><text x="566.4" y="241" font-size="13">11,2</text><text x="198" y="290" font-size="14" text-anchor="end">Omnilux Contour</text><rect x="210" y="270" width="497.8" height="28" fill="#161616"/><text x="715.8" y="289" font-size="13">16,0</text><text x="198" y="338" font-size="14" text-anchor="end">Foreo FAQ 202</text><text x="218" y="338" font-size="14" fill="#9a3b3b">Sin dato · no se dibuja un cero</text></svg>
