<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" role="img" aria-labelledby="title desc">
<title>Esquema de la fotobiomodulación</title>
<desc>Esquema cualitativo de penetración y del citocromo c oxidasa.</desc>
<rect width="880" height="360" fill="#ffffff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#161616}</style>
<text x="32" y="34" font-size="18" font-weight="700">Esquema, no una medición</text><text x="32" y="56" font-size="12" fill="#505050">Hipótesis de trabajo en la literatura. No demuestra el efecto de estas mascarillas.</text><rect x="40" y="100" width="170" height="150" fill="#f7f7f7" stroke="#e3e3e3"/><text x="56" y="132" font-size="13" fill="#0055ff">1</text><text x="56" y="158" font-size="16" font-weight="700">Luz roja o NIR</text><text x="56" y="188" font-size="13" fill="#505050">LED de la mascarilla,</text><text x="56" y="208" font-size="13" fill="#505050">sin quemar la piel</text><rect x="250" y="100" width="170" height="150" fill="#f7f7f7" stroke="#e3e3e3"/><text x="266" y="132" font-size="13" fill="#0055ff">2</text><text x="266" y="158" font-size="16" font-weight="700">Piel</text><text x="266" y="188" font-size="13" fill="#505050">El rojo se queda</text><text x="266" y="208" font-size="13" fill="#505050">más superficial</text><rect x="460" y="100" width="170" height="150" fill="#f7f7f7" stroke="#e3e3e3"/><text x="476" y="132" font-size="13" fill="#0055ff">3</text><text x="476" y="158" font-size="16" font-weight="700">Mitocondria</text><text x="476" y="188" font-size="13" fill="#505050">Hipótesis: absorbe</text><text x="476" y="208" font-size="13" fill="#505050">el citocromo c oxidasa</text><rect x="670" y="100" width="170" height="150" fill="#f7f7f7" stroke="#e3e3e3"/><text x="686" y="132" font-size="13" fill="#0055ff">4</text><text x="686" y="158" font-size="16" font-weight="700">Respuesta</text><text x="686" y="188" font-size="13" fill="#505050">Más ATP es una</text><text x="686" y="208" font-size="13" fill="#505050">hipótesis, no un hecho</text><path d="M210 175 h28 l-8 -6 m8 6 l-8 6" fill="none" stroke="#0055ff" stroke-width="2"/><path d="M420 175 h28 l-8 -6 m8 6 l-8 6" fill="none" stroke="#0055ff" stroke-width="2"/><path d="M630 175 h28 l-8 -6 m8 6 l-8 6" fill="none" stroke="#0055ff" stroke-width="2"/><text x="32" y="292" font-size="14">Rojo (~630–660 nm): se absorbe antes y se queda más superficial.</text><text x="32" y="316" font-size="14">Infrarrojo cercano (~810–850 nm): penetra más. Fuera de esas ventanas hay menos evidencia.</text><text x="32" y="344" font-size="13" fill="#505050">Mecanismo: de Freitas y Hamblin, 2016; Chung et al., 2012. Dosis bifásica: Huang et al., 2009.</text></svg>
